<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Open in Vinted - SNYPD</title>
<link rel="icon" href="/assets/icons/icon-192.png">
<style>
  :root { --bg:#0b0b0c; --fg:#f5f5f5; --muted:#a1a1aa; --btn:#09b1ba; --btn-fg:#04181a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:32px 16px calc(32px + env(safe-area-inset-bottom)); text-align:center; gap:18px; }
  h1 { font-size:22px; margin:0; font-weight:700; }
  p { margin:0; color:var(--muted); font-size:15px; line-height:1.45; max-width:340px; }
  a.open { display:block; width:100%; max-width:340px; padding:18px 20px; border-radius:14px; background:var(--btn);
    color:var(--btn-fg); font-size:18px; font-weight:700; text-decoration:none; }
  a.back { color:var(--muted); font-size:14px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1 id="t">Your find is ready</h1>
  <p id="d">Tap the button to open it in the Vinted app, where you are logged in.</p>
  <a class="open" id="go" href="/dashboard" rel="noopener noreferrer">Open in Vinted</a>
  <p id="n" hidden>This link could not be opened. Your finds are on your dashboard.</p>
  <a class="back" id="b" href="/dashboard">Back to SNYPD</a>
</main>
<script>
/* Notification handoff (sw.js, outreach/47). iOS opens the Vinted app only from a real tap on a universal link,
   never from a link opened by code, so this page exists to be that tap. Only https www.vinted.<tld>/items/<id>
   links are accepted (keep VINTED_RE in step with sw.js); anything else shows the dashboard instead. */
(function () {
  var VINTED_RE = /^(www\.)?vinted\.(be|fr|nl|de|it|es|pt|at|lu|ie|co\.uk|com|pl|cz|sk|lt|lv|ee|fi|se|dk|hu|ro|hr|si|gr)$/;
  var q = new URLSearchParams(location.hash.slice(1));
  var fr = q.get('lang') === 'fr' || (!q.get('lang') && /^fr/i.test(navigator.language || ''));
  var ok = null;
  try {
    var u = new URL(q.get('url') || '');
    if (u.protocol === 'https:' && !u.username && !u.password && !u.port && VINTED_RE.test(u.hostname) &&
        /^\/items\/[0-9]+(?:-[^\/]*)?\/?$/.test(u.pathname)) ok = u.origin + u.pathname;
  } catch (e) {}
  var go = document.getElementById('go');
  if (fr) {
    document.documentElement.lang = 'fr';
    document.title = 'Ouvrir sur Vinted - SNYPD';
    document.getElementById('t').innerHTML = 'Ta trouvaille est pr&ecirc;te';
    document.getElementById('d').innerHTML = 'Touche le bouton pour l&rsquo;ouvrir dans l&rsquo;app Vinted, o&ugrave; tu es connect&eacute;(e).';
    go.textContent = 'Ouvrir sur Vinted';
    document.getElementById('n').innerHTML = 'Ce lien n&rsquo;a pas pu &ecirc;tre ouvert. Tes trouvailles sont sur ton tableau de bord.';
    document.getElementById('b').textContent = 'Retour sur SNYPD';
  }
  if (ok) { go.href = ok; }
  else {
    go.hidden = true;
    document.getElementById('d').hidden = true;
    document.getElementById('n').hidden = false;
  }
})();
</script>
</body>
</html>
