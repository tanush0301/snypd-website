name: Website checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Runtime versions
        run: |
          node --version
          python3 --version
      - name: Checkout, onboarding and navigation regressions
        run: |
          node --test ops/test_registration_measurement.cjs
          node ops/test_purchase_flow.cjs
          node ops/test_checkout_reliability.cjs
          node ops/test_growth_navigation.cjs
          node ops/test_growth_entrypoints.cjs
          node ops/test_onboarding_recovery.cjs
          node ops/test_dashboard_freshness.cjs
          node ops/test_broad_hunt.cjs
      - name: French UI and push translations
        run: |
          node ops/i18n/test_i18n.js
          node ops/i18n/test_sw_push.js
      - name: Check generated translation matches its source
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'ops/i18n')
          import gen_i18n as g
          expected = g.RUNTIME.replace('__DICT__', g.ascii_json({'fr': g.FR})).replace('__PATTERNS__', g.ascii_json({'fr': g.FR_PATTERNS}))
          actual = Path('assets/i18n.js').read_text(encoding='ascii')
          if actual.strip() != expected.strip():
              import json, re
              old = json.loads(re.search(r'  var DICT = (.*);', actual).group(1))['fr']
              for key in sorted(set(old) | set(g.FR)):
                  if old.get(key) != g.FR.get(key):
                      print('Translation drift:', repr(key), repr(old.get(key)), '->', repr(g.FR.get(key)))
              raise SystemExit('Regenerate assets/i18n.js from ops/i18n/fr.py')
          print('PASS: generated French asset matches source')
          PY
      - name: Cohort calculations and generated site checks
        run: |
          python3 ops/test_growth_report.py
          python3 ops/seo/test_gen_regions.py
          python3 ops/seo/gen_regions.py --check
          python3 ops/seo/test_search_publication.py
          python3 ops/seo/gen_search_assets.py --check
          python3 ops/seo/check_site.py
          python3 ops/seo/audit_search.py
      - name: Install locked authentication test dependencies
        run: npm ci --prefix ops/auth --ignore-scripts --no-audit --no-fund
      - name: Authentication confirmation regressions
        run: |
          npm test --prefix ops/auth
          node --test ops/test_price_checker.cjs