<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Redirecting…</title>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<!-- Search management moved into the in-app filter sheet (Ledger 2a) per the
     design handoff's own bug list: "a separate filters page must not exist".
     vercel.json redirects /filters -> /dashboard at the routing layer for
     anyone hitting the clean URL; this file is the fallback for a direct or
     cached link to filters.html itself, which that redirect rule doesn't
     match (different path). -->
<meta http-equiv="refresh" content="0; url=/dashboard"/>
<style>html,body{margin:0;background:#0B0C0D;color:#7C8489;font-family:'DM Mono',ui-monospace,monospace;display:flex;align-items:center;justify-content:center;height:100vh}</style>
<script>location.replace('/dashboard');</script>
</head><body>
Redirecting to <a href="/dashboard" style="color:#00E5A0">the dashboard</a>…
</body></html>
