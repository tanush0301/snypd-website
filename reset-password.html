<script>
    document.addEventListener("DOMContentLoaded", function() {
      const toggleBtn = document.getElementById("snypdMobileToggle");
      const mobileMenu = document.getElementById("snypdMobileMenu");
      const menuLinks = document.querySelectorAll(".mobile-menu-link");

      // Toggle menu on hamburger click
      toggleBtn.addEventListener("click", function(e) {
        e.stopPropagation(); // Prevents click from bubbling to document
        mobileMenu.classList.toggle("active");
      });

      // Close menu when clicking outside of it
      document.addEventListener("click", function(e) {
        if (!mobileMenu.contains(e.target) && e.target !== toggleBtn) {
          mobileMenu.classList.remove("active");
        }
      });
      
      // Close menu when a link inside it is clicked (for anchor links like #pricing)
      menuLinks.forEach(link => {
        link.addEventListener("click", () => {
          mobileMenu.classList.remove("active");
        });
      });
    });
  </script>

<script>
  /* ------- ensure Supabase SDK (auto-load if missing) ------- */
  (function ensureSupabase(cb){
    if (window.supabase && typeof window.supabase.createClient==='function') return cb();
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
    s.onload=()=>cb();
    document.body.appendChild(s);
  })(initReset);

  /* ---------------- utilities ---------------- */
  function toast(msg, ok=true){
    document.querySelectorAll('.toast').forEach(t=>t.remove());
    const t=document.createElement('div'); t.className=`toast ${ok?'ok':'bad'}`; t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(-6px)'; setTimeout(()=>t.remove(),260); },3600);
  }
  function strength(p){ let s=0; if(p.length>7) s++; if(/[A-Z]/.test(p)) s++; if(/[0-9]/.test(p)) s++; if(/[^A-Za-z0-9]/.test(p)) s++; return Math.min(s,4)/4; }
  (function tiltCard(){ const card=document.getElementById('authCard'); if(!card) return;
    const rect=()=>card.getBoundingClientRect();
    card.addEventListener('mousemove',e=>{ const r=rect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height; card.style.transform=`rotateX(${-(y-0.5)*6}deg) rotateY(${(x-0.5)*8}deg)`; });
    card.addEventListener('mouseleave',()=> card.style.transform='rotateX(0) rotateY(0)');
  })();

  /* -------- robust token handling + reset flow -------- */
  function initReset(){
    const sb = window.SNYPD.supabase;   // shared client from <head>

    const form  = document.getElementById('reset_form');
    const btn   = document.getElementById('resetBtn');
    const bar   = document.getElementById('topbar');
    const card  = document.getElementById('authCard');
    const pwdEl = document.getElementById('pwd');
    const pwd2  = document.getElementById('pwd2');
    const meter = document.getElementById('meterFill');
    const eye1  = document.getElementById('togglePwd');
    const eye2  = document.getElementById('togglePwd2');

    function toggle(el){ el.setAttribute('type', el.getAttribute('type')==='password' ? 'text' : 'password'); }
    eye1?.addEventListener('click', ()=>toggle(pwdEl));
    eye2?.addEventListener('click', ()=>toggle(pwd2));
    pwdEl.addEventListener('input', ()=>{ meter.style.width=(strength(pwdEl.value)*100)+'%'; });

    // Try to establish a session from URL (PKCE or classic recovery)
async function establishResetSession() {
  const hash  = new URLSearchParams(location.hash.replace(/^#/, ''));
  const query = new URLSearchParams(location.search);

  // 1) PKCE / OIDC style: ?code=... (can be in query or hash)
  const code = query.get('code') || hash.get('code');
  if (code) {
    const { error } = await sb.auth.exchangeCodeForSession(code);
    if (error) throw error;
    return true;
  }

  // 2) Supabase classic recovery formats:
  //    A) redirect_to...#/type=recovery&access_token=...&refresh_token=...
  //    B) ?type=recovery&token=... (older template)
  const src  = (hash.get('type') || hash.get('access_token')) ? hash : query;
  const type = src.get('type');
  const at   = src.get('access_token') || src.get('token');     // token alias
  const rt   = src.get('refresh_token') || null;

  if (type === 'recovery' && at) {
    const { error } = await sb.auth.setSession({ access_token: at, refresh_token: rt });
    if (error) throw error;
    return true;
  }

  // 3) If we already have a session, that’s fine (user might have clicked link twice)
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) return true;

  // Nothing usable found
  throw new Error('no-recovery-token');
}

    (async () => {
      try {
        await establishResetSession();
      } catch (e) {
        if (e.message === 'no-recovery-token') {
          toast('This reset link is invalid or expired. Request a new one from the login page.', false);
        } else {
          console.error(e);
          toast('Could not verify reset link. Try again from the login page.', false);
        }
      }
    })();

    // Handle the actual password update
    form?.addEventListener('submit', async(e)=>{
      e.preventDefault();
      const p1=pwdEl.value, p2=pwd2.value;

      if(!p1 || !p2) return toast('Enter and confirm your new password', false);
      if(p1!==p2)   return toast('Passwords do not match', false);
      let s=0; if(p1.length>7) s++; if(/[A-Z]/.test(p1)) s++; if(/[0-9]/.test(p1)) s++; if(/[^A-Za-z0-9]/.test(p1)) s++;
      if(s<2) return toast('Use a stronger password (mix of cases, numbers, symbol)', false);

      btn.disabled=true;
      const label=btn.querySelector('.content'); const original=label?label.textContent:'';
      if(label) label.innerHTML='<span class="spinner"></span> Updating…'; bar.style.width='40%';

      try{
        const { error } = await sb.auth.updateUser({ password: p1 });
        bar.style.width='100%';
        if(error) throw error;

        if(label) label.textContent='Password updated';
        toast('Password updated. You can log in now.', true);
        setTimeout(()=>{ window.location.href='/login'; }, 900);
      }catch(err){
        console.error(err);
        bar.style.width='0%';
        toast(err.message || 'Could not update password', false);
        btn.disabled=false; if(label) label.textContent=original||'Update password';
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      }
    });
  }
